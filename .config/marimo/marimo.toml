[ai.custom_providers]

[ai.models]
custom_models = []
chat_model = "github/gpt-5"
edit_model = "github/gpt-5"
displayed_models = []

[display]
default_table_page_size = 10
dataframes = "rich"
code_editor_font_size = 14
default_table_max_columns = 50
default_width = "medium"
cell_output = "below"
reference_highlighting = true
theme = "system"

[snippets]
include_default_snippets = true
custom_paths = []

[diagnostics]
sql_linter = true

[save]
autosave = "after_delay"
format_on_save = false
autosave_delay = 1000

[server]
follow_symlink = false
browser = "default"

[package_management]
manager = "uv"

[keymap]
preset = "default"

[keymap.overrides]

[completion]
signature_hint_on_typing = true
activate_on_typing = true
copilot = "custom"

[mcp]
presets = []

[mcp.mcpServers]

[formatting]
line_length = 79

[language_servers.pylsp]
enable_pylint = false
enable_ruff = true
enable_flake8 = false
enable_pydocstyle = false
enable_mypy = true
enable_pyflakes = false
enabled = false

[language_servers.basedpyright]
enabled = true

[runtime]
show_tracebacks = false
auto_reload = "lazy"
on_cell_change = "lazy"
std_stream_max_bytes = 1000000
watcher_on_save = "lazy"
default_csv_encoding = "utf-8"
auto_instantiate = false
reactive_tests = true
default_sql_output = "auto"
output_max_bytes = 8000000
