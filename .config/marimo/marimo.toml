[ai.custom_providers]

[ai.models]
displayed_models = []
custom_models = []
chat_model = "github/gpt-5"
edit_model = "github/gpt-5"

[package_management]
manager = "uv"

[diagnostics]
sql_linter = true

[save]
autosave = "after_delay"
format_on_save = false
autosave_delay = 1000

[display]
reference_highlighting = true
cell_output = "below"
default_table_max_columns = 50
code_editor_font_size = 14
dataframes = "rich"
default_table_page_size = 10
theme = "system"
default_width = "medium"

[mcp]
presets = []

[mcp.mcpServers]

[runtime]
output_max_bytes = 8000000
on_cell_change = "lazy"
default_csv_encoding = "utf-8"
auto_reload = "lazy"
reactive_tests = true
std_stream_max_bytes = 1000000
default_sql_output = "auto"
auto_instantiate = false
watcher_on_save = "lazy"

[server]
browser = "default"
follow_symlink = false

[language_servers.pylsp]
enable_mypy = true
enabled = false
enable_pyflakes = false
enable_flake8 = false
enable_ruff = true
enable_pylint = false
enable_pydocstyle = false

[snippets]
custom_paths = []
include_default_snippets = true

[completion]
activate_on_typing = true
signature_hint_on_typing = false
copilot = "custom"

[formatting]
line_length = 79

[keymap]
preset = "default"

[keymap.overrides]
